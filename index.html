  var ITER = 200000;

  var input = document.getElementById("oldkey");
  var btn = document.getElementById("go");
  var result = document.getElementById("result");
  var errBox = document.getElementById("err");
  var subtle = (window.crypto && window.crypto.subtle) ? window.crypto.subtle : null;

  function b64ToBytes(b64) {
    var bin = atob(b64), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function bytesToHex(buf) {
    var b = new Uint8Array(buf), s = "";
    for (var i = 0; i < b.length; i++) s += b[i].toString(16).padStart(2, "0");
    return s;
  }
  function fmtCN(sec) {
    var d = new Date((sec + 8 * 3600) * 1000);
    function p(n) { return String(n).padStart(2, "0"); }
    return d.getUTCFullYear() + "-" + p(d.getUTCMonth() + 1) + "-" + p(d.getUTCDate()) +
      " " + p(d.getUTCHours()) + ":" + p(d.getUTCMinutes()) + "（北京时间）";
  }
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function showError(msg) {
    result.className = "result";
    result.innerHTML = "";
    errBox.className = "err show";
    errBox.innerHTML = msg;
  }

  function showResult(newKey, expire) {
    errBox.className = "err";
    errBox.textContent = "";
    result.className = "result show";
    result.innerHTML =
      '<div class="box">' +
        '<div class="k">新卡密</div>' +
        '<div class="row">' +
          '<div class="val" id="newkey">' + esc(newKey) + '</div>' +
          '<button class="copy" id="copyBtn" type="button">复制</button>' +
        '</div>' +
        '<div class="exp">到期：' + (expire === null ? '<b>永久有效</b>' : '<b>' + fmtCN(expire) + '</b>') + '</div>' +
      '</div>';

    var copyBtn = document.getElementById("copyBtn");
    copyBtn.addEventListener("click", function () {
      copyText(newKey).then(function () {
        copyBtn.textContent = "已复制";
        setTimeout(function () { copyBtn.textContent = "复制"; }, 1500);
      }).catch(function () {
        copyBtn.textContent = "复制失败";
        setTimeout(function () { copyBtn.textContent = "复制"; }, 1500);
      });
    });
  }

  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function (resolve, reject) {
      try {
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.top = "0";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        var ok = document.execCommand("copy");
        document.body.removeChild(ta);
        ok ? resolve() : reject(new Error("copy failed"));
      } catch (e) { reject(e); }
    });
  }

  function concat(a, b) {
    var out = new Uint8Array(a.length + b.length);
    out.set(a, 0); out.set(b, a.length);
    return out;
  }

  var busy = false;
  async function query() {
    if (busy) return;
    var raw = input.value.replace(/^\s+|\s+$/g, "");
    if (!raw) {
      showError("请先输入旧卡密。");
      input.focus();
      return;
    }
    if (!subtle) {
      showError("当前浏览器环境不支持安全解密，请更换浏览器后重试。");
      return;
    }

    busy = true;
    btn.disabled = true;
    btn.textContent = "查询中…";

    try {
      var idx = bytesToHex(await subtle.digest("SHA-256", new TextEncoder().encode(raw)));
      var entry = null;
      for (var i = 0; i < ENTRIES.length; i++) {
        if (ENTRIES[i].i === idx) { entry = ENTRIES[i]; break; }
      }
      if (!entry) {
        showError("未找到该旧卡密，请确认已完整复制且大小写一致。");
        return;
      }

      var salt = b64ToBytes(entry.s);
      var iv = b64ToBytes(entry.v);
      var blob = b64ToBytes(entry.c);
      var ct = blob.subarray(0, blob.length - 16);
      var tag = blob.subarray(blob.length - 16);

      var baseKey = await subtle.importKey("raw", new TextEncoder().encode(raw), "PBKDF2", false, ["deriveBits"]);
      var bits = await subtle.deriveBits(
        { name: "PBKDF2", salt: salt, iterations: ITER, hash: "SHA-256" },
        baseKey, 256
      );
      var aesKey = await subtle.importKey("raw", bits, { name: "AES-GCM" }, false, ["decrypt"]);
      var plain = await subtle.decrypt(
        { name: "AES-GCM", iv: iv, tagLength: 128 },
        aesKey,
        new Uint8Array(concat(ct, tag))
      );
      var payload = JSON.parse(new TextDecoder().decode(plain));

      input.value = "";
      showResult(payload.k, payload.e);
    } catch (e) {
      showError("解密失败，请核对旧卡密后重试。");
    } finally {
      busy = false;
      btn.disabled = false;
      btn.textContent = "查询";
    }
  }

  btn.addEventListener("click", query);
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); query(); }
  });
})();
</script>
